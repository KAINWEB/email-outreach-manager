<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GROWER TEAM — Email Outreach Manager</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial;background:#0b0d12;color:#eef1f7}button,input,select,textarea{font:inherit}.side{position:fixed;width:230px;inset:0 auto 0 0;background:#11141c;padding:22px;border-right:1px solid #252a36}.brand{font-weight:900;font-size:20px;margin-bottom:28px}.brand b{color:#8b5cf6}.nav button{display:block;width:100%;text-align:left;background:none;border:0;color:#aab2c5;padding:11px 12px;border-radius:8px;margin:3px 0;cursor:pointer}.nav button:hover,.nav button.on{background:#242033;color:#c4b5fd}.main{margin-left:230px;padding:28px;max-width:1500px}.top{display:flex;justify-content:space-between;align-items:center}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0}.card,.panel{background:#141821;border:1px solid #262c39;border-radius:12px;padding:18px}.num{font-size:30px;font-weight:800}.muted{color:#929bad;font-size:13px}.panel{margin:14px 0}h1{margin:0}h2{margin-top:0}input,select,textarea{background:#0d1016;border:1px solid #333a49;color:#fff;padding:9px;border-radius:7px}textarea{width:100%;min-height:100px}.btn{background:#7c3aed;color:#fff;border:0;padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:700}.btn2{background:#272d3a;color:#fff;border:0;padding:8px 11px;border-radius:7px;cursor:pointer}.danger{background:#7f1d1d}.row{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:9px;border-bottom:1px solid #292f3b;vertical-align:top}th{color:#9ba5b8}.ok{color:#4ade80}.bad{color:#fb7185}.tag{padding:3px 7px;border-radius:10px;background:#252b38;font-size:11px}.hidden{display:none}.toast{position:fixed;right:25px;bottom:25px;background:#272d3a;padding:12px 18px;border-radius:9px;display:none}.wide{width:100%}@media(max-width:900px){.side{width:180px}.main{margin-left:180px}.cards{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}}</style></head><body>
<aside class="side"><div class="brand"><b>GROWER</b> TEAM</div><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div class="muted">Email Outreach Manager · локально на вашем ПК</div></div><div class="row"><button class="btn2" onclick="pause()">⏸ Пауза</button><button class="btn" onclick="resume()">▶ Продолжить</button></div></div><div id="view"></div></main><div class="toast" id="toast"></div>
<script>
const A='/api';let page='dashboard';let campaigns=[];const pages=[['dashboard','Dashboard'],['campaigns','Кампании'],['senders','Почты отправителей'],['recipients','Получатели'],['history','История'],['suppression','Исключения'],['settings','Настройки']];
function esc(s){return String(s??'').replace(/[&<>"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[x]))}function toast(s){let e=document.querySelector('#toast');e.textContent=s;e.style.display='block';setTimeout(()=>e.style.display='none',2500)}
async function api(p,o){let r=await fetch(A+p,o);let t=await r.text();if(!r.ok)throw Error(t);try{return JSON.parse(t)}catch{return t}}
function nav(){document.querySelector('#nav').innerHTML=pages.map(x=>'<button class="'+(page==x[0]?'on':'')+'" onclick="go(\''+x[0]+'\')">'+x[1]+'</button>').join('')}
async function go(p){page=p;nav();document.querySelector('#title').textContent=pages.find(x=>x[0]==p)[1];await render()}
async function render(){try{if(page=='dashboard')return dash();if(page=='campaigns')return camps();if(page=='senders')return senders();if(page=='recipients')return recips();if(page=='history')return history();if(page=='suppression')return suppress();if(page=='settings')return settings()}catch(e){toast('Ошибка: '+e.message)}}
async function dash(){let d=await api('/dashboard');view.innerHTML='<div class="cards">'+[['Почт',d.senders],['Кампаний',d.campaigns],['В очереди',d.ready],['Отправлено',d.sent],['Ошибок',d.failed]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="num">'+x[1]+'</div></div>').join('')+'</div><div class="panel"><h2>Состояние</h2><p>Очередь: <b class="'+(d.paused?'bad':'ok')+'">'+(d.paused?'НА ПАУЗЕ':'РАБОТАЕТ')+'</b></p><p class="muted">Пароли SMTP сохраняются через системное хранилище учётных данных Windows, а не в базе SQLite.</p></div>'}
async function senders(){let a=await api('/senders');view.innerHTML='<div class="panel"><h2>Добавить SMTP-почту</h2><div class="grid"><input id="se" placeholder="email@example.com"><input id="sn" placeholder="Имя отправителя"><input id="sh" placeholder="SMTP host, например smtp.gmail.com"><input id="sp" type="number" value="587"><input id="sw" type="password" placeholder="Пароль приложения"><input id="sl" type="number" value="100" placeholder="Лимит/день"><input id="sr" type="number" step=".5" value="3" placeholder="Интервал, сек"><select id="st"><option value="tls">STARTTLS</option><option value="ssl">SSL</option></select></div><br><button class="btn" onclick="addSender()">Добавить</button></div><div class="panel"><h2>Подключённые почты</h2><table><tr><th>Email</th><th>SMTP</th><th>Сегодня / лимит</th><th>Статус</th><th>Ошибка</th><th></th></tr>'+a.map(s=>'<tr><td>'+esc(s.email)+'<br><span class=muted>'+esc(s.name)+'</span></td><td>'+esc(s.host)+':'+s.port+'</td><td>'+s.sent_today+' / '+s.daily_limit+'</td><td>'+(s.enabled?'<span class=ok>Включена</span>':'Выключена')+'</td><td class=bad>'+esc(s.last_error||'')+'</td><td><button class=btn2 onclick="testS('+s.id+')">Тест</button> <button class=btn2 onclick="toggleS('+s.id+')">Вкл/выкл</button> <button class="btn2 danger" onclick="delS('+s.id+')">×</button></td></tr>').join('')+'</table></div>'}
async function addSender(){let ssl=st.value=='ssl';await api('/senders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:se.value,name:sn.value,host:sh.value,port:+sp.value,use_ssl:ssl,use_starttls:!ssl,password:sw.value,daily_limit:+sl.value,rate_seconds:+sr.value})});toast('Почта добавлена');senders()}async function testS(id){let x=await api('/senders/'+id+'/test',{method:'POST'});toast(x.ok?'Соединение успешно':'Ошибка: '+x.error);senders()}async function toggleS(id){await api('/senders/'+id+'/toggle',{method:'POST'});senders()}async function delS(id){if(confirm('Удалить почту?')){await api('/senders/'+id,{method:'DELETE'});senders()}}
async function camps(){campaigns=await api('/campaigns');view.innerHTML='<div class="panel"><h2>Автоимпорт базы</h2><p class="muted">Загрузи XLSX/CSV — программа сама найдёт email, компанию, имя и индивидуальный текст, уберёт дубли и построит план по подключённым почтам.</p><div class=row><input type=file id=autoFile accept=".xlsx,.csv"><button class=btn onclick="autoImport()">Разобрать таблицу автоматически</button></div><div id=autoResult></div><hr style="border-color:#292f3b;margin:18px 0"><div class=row><input id=cn placeholder="Название пустой кампании"><button class=btn2 onclick="newCamp()">Создать вручную</button></div></div><div class=panel><table><tr><th>Кампания</th><th>Статус</th><th>Всего</th><th>SENT</th><th>FAILED</th><th></th></tr>'+campaigns.map(c=>'<tr><td><b>'+esc(c.name)+'</b><br><span class=muted>'+esc(c.created_at)+'</span></td><td><span class=tag>'+c.status+'</span></td><td>'+c.total+'</td><td class=ok>'+(c.sent||0)+'</td><td class=bad>'+(c.failed||0)+'</td><td><button class=btn2 onclick="importUI('+c.id+')">Импорт</button> <button class=btn onclick="queue('+c.id+')">Запустить</button> <button class=btn2 onclick="location.href=A+\'/export/'+c.id+'\'">CSV</button></td></tr>').join('')+'</table></div><div id=importBox></div>'}
async function autoImport(){if(!autoFile.files[0])return toast('Выбери XLSX или CSV');let fd=new FormData();fd.append('file',autoFile.files[0]);let r=await fetch(A+'/import/auto',{method:'POST',body:fd});let x=await r.json();if(!r.ok){toast('Не удалось распознать таблицу');return}let alloc=(x.allocation||[]).map(a=>'<li>'+esc(a.sender)+' — '+a.count+' писем, интервал '+a.rate_seconds+' сек.</li>').join('');autoResult.innerHTML='<div class=panel><h3>План готов</h3><p><b>'+x.added+'</b> получателей добавлено; дублей: '+x.duplicates+'; пропущено: '+x.skipped+'.</p><p>Сегодня можно отправить <b>'+x.planned_today+'</b>; останется на следующие дни: <b>'+x.remaining_after_today+'</b>.</p>'+(x.active_senders?'<ul>'+alloc+'</ul>':'<p class=bad>Сначала подключи хотя бы одну почту отправителя — база уже разобрана и сохранена.</p>')+'<button class=btn onclick="queue('+x.campaign_id+')">Запустить этот план</button></div>';toast('Таблица разобрана автоматически')}async function newCamp(){if(!cn.value)return;await api('/campaigns',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:cn.value})});camps()}
function importUI(id){importBox.innerHTML='<div class=panel><h2>Импорт XLSX / CSV</h2><input type=file id=imp accept=".xlsx,.csv"> <button class=btn2 onclick="preview('+id+')">Прочитать столбцы</button><div id=map></div></div>'}
async function preview(id){let fd=new FormData();fd.append('file',imp.files[0]);let x=await api('/import/preview',{method:'POST',body:fd});let opts=k=>'<select id=m_'+k+'><option value="">— '+k+' —</option>'+x.headers.map(h=>'<option '+(h.toLowerCase()==k?'selected':'')+'>'+esc(h)+'</option>').join('')+'</select>';map.innerHTML='<p>Сопоставь столбцы. Обязательны: email, subject, message.</p><div class=row>'+['email','company','name','subject','message'].map(opts).join('')+'</div><br><button class=btn onclick="doImport('+id+')">Импортировать</button><pre>'+esc(JSON.stringify(x.sample,null,2))+'</pre>'}
async function doImport(id){let m={};['email','company','name','subject','message'].forEach(k=>m[k]=document.querySelector('#m_'+k).value);let fd=new FormData();fd.append('file',imp.files[0]);let r=await fetch(A+'/import/'+id+'?mapping='+encodeURIComponent(JSON.stringify(m)),{method:'POST',body:fd});let x=await r.json();toast('Добавлено '+x.added+', пропущено '+x.skipped);camps()}async function queue(id){if(confirm('Поставить READY/FAILED получателей в очередь?')){await api('/campaigns/'+id+'/queue',{method:'POST'});toast('Кампания запущена');camps()}}
async function recips(){let a=await api('/recipients');view.innerHTML='<div class=panel><h2>Последние получатели</h2><table><tr><th>Email</th><th>Компания / имя</th><th>Тема</th><th>Статус</th><th>Ошибка</th></tr>'+a.map(r=>'<tr><td>'+esc(r.email)+'</td><td>'+esc(r.company)+'<br>'+esc(r.name)+'</td><td>'+esc(r.subject)+'</td><td><span class=tag>'+r.status+'</span></td><td class=bad>'+esc(r.error||'')+'</td></tr>').join('')+'</table></div>'}
async function history(){let a=await api('/logs');view.innerHTML='<div class=panel><table><tr><th>Время</th><th>Получатель</th><th>Отправитель</th><th>Тема</th><th>Статус</th><th>Ошибка</th></tr>'+a.map(x=>'<tr><td>'+esc(x.ts)+'</td><td>'+esc(x.email)+'</td><td>'+esc(x.sender)+'</td><td>'+esc(x.subject)+'</td><td>'+x.status+'</td><td class=bad>'+esc(x.error||'')+'</td></tr>').join('')+'</table></div>'}
async function suppress(){let a=await api('/suppression');view.innerHTML='<div class=panel><div class=row><input id=su placeholder="email@example.com"><input id=reason placeholder="Причина"><button class=btn onclick="addSupp()">Добавить в исключения</button></div></div><div class=panel><table>'+a.map(x=>'<tr><td>'+esc(x.email)+'</td><td>'+esc(x.reason)+'</td><td>'+esc(x.created_at)+'</td></tr>').join('')+'</table></div>'}async function addSupp(){await api('/suppression',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:su.value,reason:reason.value})});suppress()}
function settings(){view.innerHTML='<div class=panel><h2>Настройки</h2><p>Данные программы: <code>data/app.db</code> рядом с приложением.</p><p>SMTP-пароли: системное защищённое хранилище Windows.</p><p>Повторные попытки: до 3. Интервал между письмами задаётся отдельно для каждой почты. Дневной лимит также задаётся для каждой почты.</p><p class=muted>Отправляй письма только адресатам, которым допустимо писать; используй список исключений для отписок.</p></div>'}
async function pause(){await api('/pause',{method:'POST'});toast('Очередь приостановлена');if(page=='dashboard')dash()}async function resume(){await api('/resume',{method:'POST'});toast('Очередь продолжена');if(page=='dashboard')dash()}
nav();render();setInterval(()=>{if(page=='dashboard')dash()},5000)
</script></body></html>
