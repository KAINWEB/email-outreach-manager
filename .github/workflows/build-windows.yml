name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Copy frontend into backend
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force backend/app/static | Out-Null
          Copy-Item frontend/dist/* backend/app/static/ -Recurse -Force

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend and packager
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pyinstaller

      - name: Run backend tests
        id: backend_tests
        working-directory: backend
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pytest -vv -s 2>&1 | Tee-Object -FilePath pytest-output.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload pytest diagnostics
        if: failure() && steps.backend_tests.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: pytest-diagnostics
          path: backend/pytest-output.txt

      - name: Build EXE
        working-directory: backend
        run: >-
          pyinstaller --noconfirm --clean --name EmailOutreachManager
          --collect-all email_validator
          --collect-all uvicorn
          --add-data "app/static;app/static"
          desktop.py

      - name: Prepare portable package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release/EmailOutreachManager/data/uploads | Out-Null
          New-Item -ItemType Directory -Force release/EmailOutreachManager/data/exports | Out-Null
          Copy-Item backend/dist/EmailOutreachManager/* release/EmailOutreachManager/ -Recurse -Force
          Copy-Item backend/.env.example release/EmailOutreachManager/.env.example
          Copy-Item WINDOWS_SETUP.md release/EmailOutreachManager/WINDOWS_SETUP.md
          Compress-Archive -Path release/EmailOutreachManager -DestinationPath release/EmailOutreachManager-Windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: EmailOutreachManager-Windows-x64
          path: release/EmailOutreachManager-Windows-x64.zip

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/EmailOutreachManager-Windows-x64.zip
